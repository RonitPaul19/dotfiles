# ============================================================ 
# psmux — minimal tmux-style configuration 
# ============================================================ 
 
# ------------------------------------------------------------ 
# General 
# ------------------------------------------------------------ 

set -g cursor-style block
set -g cursor-blink off
 
set -g prefix C-a 
unbind-key C-b 
 
set -g base-index 1 
set -g pane-base-index 1 
 
set -g detach-on-destroy off 
set -g escape-time 0 
set -g history-limit 1000000 
set -g renumber-windows on 
 
set -g mode-keys vi 
set -g set-clipboard on 
 
# Put status bar at the top 
set -g status-position top 
 
# Truecolor / terminal 
set -g default-terminal "xterm-256color" 
 
# ------------------------------------------------------------ 
# Pane borders 
# ------------------------------------------------------------ 
 
set -g pane-active-border-style "fg=magenta,bg=default" 
set -g pane-border-style "fg=brightblack,bg=default" 
 
# ------------------------------------------------------------ 
# Status bar 
# ------------------------------------------------------------ 
 
set -g status on 
set -g status-interval 1 
 
set -g status-style "bg=#191724,fg=#ffffff" 
 
set -g status-left-length 40 
set -g status-right-length 80 
 
# Left: session 
set -g status-left "#[fg=#89b4fa] #[bg=#89b4fa,fg=#191724,bold] #S #[bg=#191724,fg=#89b4fa] " 
 
# Right: current directory 
set -g status-right "#[fg=#89b4fa]#[bg=#89b4fa,fg=#191724,bold] 󰉋 #{b:pane_current_path} #[bg=#191724,fg=#89b4fa]" 
 
# ------------------------------------------------------------ 
# Windows 
# ------------------------------------------------------------ 
 
# Separator 
set -g window-status-separator " " 
 
# Inactive windows 
set -g window-status-format \ 
  "#[fg=brightblack]#[bg=brightblack,fg=#ffffff] #I:#W #[bg=#191724,fg=brightblack]" 
 
# Active window 
set -g window-status-current-format \ 
  "#[fg=magenta]#[bg=magenta,fg=#191724,bold] #I:#W #[bg=#191724,fg=magenta]" 
 
# ------------------------------------------------------------ 
# Core keymaps 
# ------------------------------------------------------------ 
 
# Reload config 
bind-key r source-file ~/.psmux.conf \; display-message "psmux config reloaded" 
 
# Split panes 
bind-key v split-window -v 
bind-key s split-window -h 
 
# Pane navigation 
bind-key h select-pane -L 
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R 
 
# Resize panes 
bind-key H resize-pane -L 5 
bind-key J resize-pane -D 5 
bind-key K resize-pane -U 5 
bind-key L resize-pane -R 5 
 
# New window 
bind-key c new-window 
 
# Next / previous window 
bind-key n next-window 
bind-key p previous-window 
 
# Kill current pane/window 
bind-key x kill-pane 
bind-key & kill-window 
 
# Zoom current pane 
bind-key z resize-pane -Z 
 
# Detach 
bind-key d detach-client 
 
# Enter copy mode 
bind-key [ copy-mode 
 
# ------------------------------------------------------------ 
# Mouse 
# ------------------------------------------------------------ 
 
set -g mouse on 
 
# ------------------------------------------------------------ 
# Useful defaults 
# ------------------------------------------------------------ 
 
# New panes/windows start in the current pane's directory 
bind-key c new-window -c "#{pane_current_path}" 
bind-key v split-window -v -c "#{pane_current_path}" 
bind-key s split-window -h -c "#{pane_current_path}" 
