watch_stylesheet: true
watch_config: true
debug: false
update_check: true

bars:
  primary-bar:
    enabled: true
    screens: ["primary"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "center"
    animation:
      enabled: true
      duration: 500
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 900
      height: 25
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["volume", "cava"]
      center: ["glazewm-workspaces", "power_menu", "clock"]
      right: ["wifi", "battery"]

widgets:
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{level}"
      volume_icons:
      - "" # Muted
      - "" # 0–10%
      - "" # 11–30%
      - "" # 31–60%
      - "" # 61–100%
    keybindings:
        - keys: "ctrl+alt+m"
          action: "toggle_mute"
        - keys: "ctrl+alt+up"
          action: "volume_up"
        - keys: "ctrl+alt+down"
          action: "volume_down"
      container_padding:
        top: 0
        left: 8
        bottom: 0
        right: 8
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      container_padding:
        top: 0
        left: 8
        bottom: 0
        right: 8
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% | {time_remaining}"
      container_padding:
        top: 0
        left: 8
        bottom: 0
        right: 8
  glazewm-workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      container_padding:
        top: 0
        left: 8
        bottom: 0
        right: 8
  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      bars_number: 4
      bar_spacing: 2
      bar_width: 2
      sensitivity: 75
      gradient: 1
      gradient_color_1: "#bb9af7"
      gradient_color_2: "#7aa2f7"
      gradient_color_3: "#9ece6a"
      framerate: 60
      sleep_timer: 2
      hide_empty: true
      container_padding:
        top: 0
        left: 8
        bottom: 0
        right: 0
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}"
      label_alt: "{%A, %B %d, %Y}"
      timezones: []
      keybindings:
        - keys: "ctrl+alt+d"
          action: "toggle_calendar"
      calendar:
        alignment: "center"
        offset_left: -60
        offset_top: 10
      callbacks:
        on_left: "toggle_calendar"
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      keybindings:
        - keys: "ctrl+alt+p"
          action: "toggle_power_menu"
      uptime: true
      show_user: true
      blur: false
      menu_style: "popup"
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "center"
        direction: "down"
        offset_top: 10
        offset_left: -30
      profile_image_size: 64
      buttons:
        lock: ["", "Lock"]
        sleep: ["", "Sleep"]
        restart: ["", "Restart"]
        shutdown: ["⏻", "Shut Down"]
        cancel: ["󰜺", "Cancel"]
      callbacks:
        on_left: "toggle_power_menu"
